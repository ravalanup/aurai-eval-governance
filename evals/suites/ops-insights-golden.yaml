    value:
      type: object
      required:
      - briefing
      - proposals
      additionalProperties: false
      properties:
        briefing:
          type: string
          minLength: 1
          maxLength: 1200
        proposals:
          type: array
          minItems: 1
          maxItems: 3
          items:
            type: object
            required:
            - area
            - title
            - body
            additionalProperties: false
            properties:
              area:
                enum:
                - Riverside Rides
              title:
                type: string
                minLength: 1
                maxLength: 120
              body:
                type: string
                minLength: 1
                maxLength: 600
  - type: icontains
    value: Riverside Rides
- id: severity-lead
  description: The briefing leads with the most severe incident.
  vars:
    facts: '{"days": 7, "areas": {"Lantern Gardens": {"downtime": {"total_minutes_down": 40, "daily": [{"date": "2026-11-13", "minutes_down": 40}]}, "incidents": [{"date": "2026-11-13", "severity": "high", "summary": "Lantern lift stalled with guests aboard"}, {"date": "2026-11-12", "severity": "low", "summary": "Lantern bulb replaced"}], "open_tickets": [{"id": "T-2410", "title": "Lift stall review", "status": "open"}]}, "Main Street Shops": {"downtime": {"total_minutes_down": 0, "daily": []}, "incidents": [{"date": "2026-11-11", "severity": "low", "summary": "Register paper jam"}], "open_tickets": []}}}'
  assert:
  - type: is-json
    value:
      type: object
      required:
      - briefing
      - proposals
      additionalProperties: false
      properties:
        briefing:
          type: string
          minLength: 1
          maxLength: 1200
        proposals:
          type: array
          minItems: 0
          maxItems: 3
          items:
            type: object
            required:
            - area
            - title
            - body
            additionalProperties: false
            properties:
              area:
                enum:
                - Lantern Gardens
                - Main Street Shops
              title:
                type: string
                minLength: 1
                maxLength: 120
              body:
                type: string
                minLength: 1
                maxLength: 600
  - type: icontains
    value: Lantern Gardens
  - type: llm-rubric
    value: The briefing mentions the high-severity lift stall at Lantern Gardens before it mentions any low-severity incident, and does not describe the low-severity items as serious.
- id: rubric-quality
  description: A mixed week reads as a usable briefing.
  vars:
    facts: '{"days": 7, "areas": {"Harbor Coaster": {"downtime": {"total_minutes_down": 30, "daily": [{"date": "2026-11-11", "minutes_down": 30}]}, "incidents": [{"date": "2026-11-11", "severity": "medium", "summary": "Queue display offline"}], "open_tickets": []}, "Riverside Rides": {"downtime": {"total_minutes_down": 0, "daily": []}, "incidents": [], "open_tickets": [{"id": "T-2500", "title": "Replace worn handrail", "status": "open"}]}, "Main Street Shops": {"downtime": {"total_minutes_down": 0, "daily": []}, "incidents": [], "open_tickets": []}}}'
  assert:
  - type: is-json
    value:
      type: object
      required:
      - briefing
      - proposals
      additionalProperties: false
