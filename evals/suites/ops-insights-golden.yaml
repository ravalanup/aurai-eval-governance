          type: string
          minLength: 1
          maxLength: 1200
        proposals:
          type: array
          minItems: 0
          maxItems: 3
          items:
            type: object
            required:
            - area
            - title
            - body
            additionalProperties: false
            properties:
              area:
                enum:
                - Harbor Coaster
                - Riverside Rides
                - Main Street Shops
              title:
                type: string
                minLength: 1
                maxLength: 120
              body:
                type: string
                minLength: 1
                maxLength: 600
  - type: llm-rubric
    value: The briefing is accurate to the facts, is concise, uses plain operational language, and tells a manager what needs attention. It does not invent incidents, numbers or causes.
