{{- if .Values.fanout.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-fanout-config
  labels:
    {{- include "aurai-observability.labels" . | nindent 4 }}
data:
  config.yaml: |
    {{- .Files.Get "files/fanout-collector.yaml" | nindent 4 }}
---
apiVersion: v1
kind: Service
metadata:
  name: otel-fanout
  labels:
    {{- include "aurai-observability.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/name: otel-fanout
  ports:
    - name: otlp-grpc
      port: 4317
      targetPort: otlp-grpc
    - name: otlp-http
      port: 4318
      targetPort: otlp-http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: otel-fanout
  labels:
    app.kubernetes.io/name: otel-fanout
    {{- include "aurai-observability.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.fanout.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: otel-fanout
  template:
    metadata:
      labels:
        app.kubernetes.io/name: otel-fanout
        {{- include "aurai-observability.labels" . | nindent 8 }}
      annotations:
        checksum/config: {{ .Files.Get "files/fanout-collector.yaml" | sha256sum }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: otel-fanout
          image: {{ .Values.fanout.image }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          args: ["--config=/conf/config.yaml"]
          env:
            - name: LANGFUSE_OTLP_ENDPOINT
              value: {{ .Values.fanout.langfuseEndpoint | quote }}
            - name: PHOENIX_OTLP_ENDPOINT
              value: {{ required "fanout.phoenixEndpoint must be set when fanout.enabled" .Values.fanout.phoenixEndpoint | quote }}
            - name: LANGFUSE_BASIC_AUTH
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingSecret }}
                  key: langfuse-basic-auth
          ports:
            - name: otlp-grpc
              containerPort: 4317
            - name: otlp-http
              containerPort: 4318
            - name: health
              containerPort: 13133
          readinessProbe:
            httpGet:
              path: /
              port: health
          livenessProbe:
            httpGet:
              path: /
              port: health
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            {{- toYaml .Values.fanout.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /conf
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: otel-fanout-config
{{- end }}
